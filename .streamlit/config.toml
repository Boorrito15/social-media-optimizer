[theme]
base = "light"
primaryColor = "#1A1A1A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F4F6"
textColor = "#0D0D0D"
font = "sans serif"

[server]
headless = true
runOnSave = true
fileWatcherType = "auto"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showSidebarNavigation = false